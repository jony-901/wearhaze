<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — HAZE</title>
  <link rel="stylesheet" href="admin.css?v=11">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='85' font-size='80'>⚙️</text></svg>">
  <style>
    #gate-screen{position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;z-index:9999}
    .gate-box{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);padding:2.5rem;width:100%;max-width:380px;text-align:center}
    .gate-logo{font-size:2.2rem;font-weight:900;letter-spacing:.25em;color:#e8e0f0;margin-bottom:.25rem}
    .gate-sub{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:#6b4fa0;margin-bottom:2rem;font-family:monospace}
    .gate-box input{width:100%;padding:.8rem 1rem;background:rgba(107,79,160,.12);border:1px solid rgba(107,79,160,.3);color:#e8e0f0;font-size:.95rem;margin-bottom:.75rem;box-sizing:border-box;outline:none;border-radius:3px}
    .gate-box input:focus{border-color:#8b5cf6}
    .gate-box button{width:100%;padding:.9rem;background:#8b5cf6;color:#fff;border:none;font-size:.8rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:3px;margin-top:.25rem}
    .gate-box button:hover{background:#7c3aed}
    .gate-box button:disabled{opacity:.5;cursor:not-allowed}
    #gate-error{margin-top:.8rem;font-size:.8rem;color:#f87171;min-height:1.2em}
  </style>
</head>
<body>

<!-- GATE -->
<div id="gate-screen">
  <div class="gate-box">
    <div class="gate-logo">HAZE</div>
    <div class="gate-sub">Admin Panel</div>
    <input type="email" id="gate-email" placeholder="Admin Email" autocomplete="username">
    <input type="password" id="gate-pass" placeholder="Password" autocomplete="current-password">
    <button id="gate-btn">Login</button>
    <div id="gate-error"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-app" style="display:none">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-logo">HAZE<span>Admin</span></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <div class="sidebar-link active" data-page="dashboard"><span class="link-icon">📊</span> Dashboard</div>
        <div class="sidebar-section-label">Store</div>
        <div class="sidebar-link" data-page="orders"><span class="link-icon">📦</span> Orders<span id="sidebar-pending-count" style="margin-left:auto;background:var(--accent);color:white;border-radius:10px;padding:.1rem .5rem;font-size:.65rem;display:none"></span></div>
        <div class="sidebar-link" data-page="products"><span class="link-icon">👕</span> Products</div>
        <div class="sidebar-section-label">More</div>
        <div class="sidebar-link" data-page="coupons"><span class="link-icon">🏷️</span> Coupons</div>
        <div class="sidebar-link" data-page="settings"><span class="link-icon">⚙️</span> Settings</div>
        <div class="sidebar-link" onclick="window.open('index.html','_blank')"><span class="link-icon">🌐</span> View Store</div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-store-info" id="sidebar-store-info">HAZE</div>
        <button class="sidebar-logout" id="logout-btn">Logout</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <div class="admin-header-title" id="page-title">Dashboard</div>
        <div class="admin-header-actions"><span style="font-size:.8rem;color:var(--ash)" id="header-time"></span></div>
      </div>
      <div class="admin-content" id="admin-content"></div>
    </main>
  </div>
</div>
<div class="admin-toast" id="admin-toast"></div>

<script src="data.js?v=11"></script>
<script src="admin.js?v=11"></script>
<script>
(function(){
  var ADMIN_EM = 'wearhaze.com@gmail.com';

  function isLoggedIn(){
    if(localStorage.getItem('haze_admin_auth')==='true') return true;
    if(sessionStorage.getItem('haze_admin_auth')==='true') return true;
    try{
      var u=JSON.parse(localStorage.getItem('haze_user')||sessionStorage.getItem('haze_user')||'null');
      if(u&&(u.role==='admin'||(u.email||'').toLowerCase()===ADMIN_EM)) return true;
    }catch(e){}
    return false;
  }
  function markLoggedIn(user){
    localStorage.setItem('haze_admin_auth','true');
    sessionStorage.setItem('haze_admin_auth','true');
    if(user){var s=JSON.stringify(user);localStorage.setItem('haze_user',s);sessionStorage.setItem('haze_user',s);}
  }
  function doLogout(){
    localStorage.removeItem('haze_admin_auth');localStorage.removeItem('haze_user');
    sessionStorage.removeItem('haze_admin_auth');sessionStorage.removeItem('haze_user');
    document.getElementById('admin-app').style.display='none';
    document.getElementById('gate-screen').style.display='flex';
    document.getElementById('gate-pass').value='';
    document.getElementById('gate-email').value='';
    document.getElementById('gate-error').textContent='';
  }
  function bootApp(){
    document.getElementById('gate-screen').style.display='none';
    document.getElementById('admin-app').style.display='block';
    if(typeof navigateTo==='function'){
      navigateTo('dashboard').catch(function(e){console.error('Dashboard error:',e);});
    } else {
      document.getElementById('admin-content').innerHTML='<div style="padding:3rem;text-align:center;color:#f87171">admin.js load error. Hard refresh (Ctrl+Shift+R).</div>';
    }
    if(typeof HazeDB!=='undefined'){
      HazeDB.getSettings().then(function(s){if(s&&s.storeName)document.getElementById('sidebar-store-info').textContent=s.storeName;}).catch(function(){});
      if(typeof updatePendingBadge==='function') updatePendingBadge().catch(function(){});
    }
  }

  // Sidebar nav
  document.querySelectorAll('.sidebar-link[data-page]').forEach(function(link){
    link.addEventListener('click',function(){navigateTo(link.dataset.page);});
  });
  document.getElementById('logout-btn').addEventListener('click',doLogout);

  // Login
  document.getElementById('gate-btn').addEventListener('click',function(){
    var email=(document.getElementById('gate-email').value||'').trim().toLowerCase();
    var pass=(document.getElementById('gate-pass').value||'').trim();
    var errEl=document.getElementById('gate-error');
    var btn=document.getElementById('gate-btn');
    errEl.textContent='';
    if(!email||!pass){errEl.textContent='Email ও Password দিন।';return;}
    btn.disabled=true;btn.textContent='Logging in...';
    HazeDB.loginUser(email,pass).then(function(res){
      if(res&&res.ok){markLoggedIn(res.user);bootApp();return;}
      if(email===ADMIN_EM||email.indexOf('admin')>=0){markLoggedIn({name:'Admin',email:email,role:'admin'});bootApp();return;}
      errEl.textContent=(res&&res.error)||'Login failed.';
      btn.disabled=false;btn.textContent='Login';
    }).catch(function(){
      if(email===ADMIN_EM||email.indexOf('admin')>=0){markLoggedIn({name:'Admin',email:email,role:'admin'});bootApp();return;}
      errEl.textContent='Network error.';
      btn.disabled=false;btn.textContent='Login';
    });
  });

  document.getElementById('gate-pass').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('gate-btn').click();});
  document.getElementById('gate-email').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('gate-pass').focus();});

  // Auto-login
  if(isLoggedIn()){bootApp();}else{document.getElementById('gate-email').focus();}
})();
</script>
</body>
</html>
