<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — HAZE</title>
  <link rel="stylesheet" href="admin.css?v=9.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='85' font-size='80'>⚙️</text></svg>">
  <style>
    #gate-screen {
      position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;
      justify-content:center;flex-direction:column;z-index:9999;
    }
    #gate-screen .gate-box {
      background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);
      padding:2.5rem;width:100%;max-width:360px;text-align:center;
    }
    #gate-screen .gate-logo {
      font-size:2rem;font-weight:900;letter-spacing:0.2em;color:#e8e0f0;margin-bottom:0.3rem;
    }
    #gate-screen .gate-sub {
      font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:#6b4fa0;
      margin-bottom:2rem;font-family:monospace;
    }
    #gate-screen input {
      width:100%;padding:0.75rem 1rem;background:rgba(107,79,160,0.1);
      border:1px solid rgba(107,79,160,0.3);color:#e8e0f0;font-size:0.95rem;
      margin-bottom:0.75rem;box-sizing:border-box;outline:none;
    }
    #gate-screen input:focus { border-color:#8b5cf6; }
    #gate-screen button {
      width:100%;padding:0.85rem;background:#8b5cf6;color:#fff;border:none;
      font-size:0.85rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;
      cursor:pointer;transition:background 0.2s;
    }
    #gate-screen button:hover { background:#7c3aed; }
    #gate-screen button:disabled { opacity:0.5;cursor:not-allowed; }
    #gate-error {
      margin-top:0.75rem;font-size:0.8rem;color:#f87171;display:none;
    }
    #gate-loading {
      color:#6b4fa0;font-size:0.8rem;margin-top:0.75rem;display:none;
    }
  </style>
</head>
<body>

<!-- ── GATE SCREEN (shown before auth check completes) ── -->
<div id="gate-screen">
  <div class="gate-box">
    <div class="gate-logo">HAZE</div>
    <div class="gate-sub">Admin Panel</div>
    <input type="email"    id="gate-email" placeholder="Admin Email" autocomplete="email">
    <input type="password" id="gate-pass"  placeholder="Password" autocomplete="current-password">
    <button id="gate-btn">Login</button>
    <div id="gate-error"></div>
    <div id="gate-loading">Checking...</div>
  </div>
</div>

<!-- ── ADMIN APP ───────────────────────────────────────── -->
<div id="admin-app" style="display:none">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-logo">HAZE<span>Admin Panel</span></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <div class="sidebar-link active" data-page="dashboard">
          <span class="link-icon">📊</span> Dashboard
        </div>
        <div class="sidebar-section-label">Store</div>
        <div class="sidebar-link" data-page="orders">
          <span class="link-icon">📦</span> Orders
          <span id="sidebar-pending-count" style="margin-left:auto;background:var(--accent);color:white;border-radius:10px;padding:0.1rem 0.5rem;font-size:0.65rem;display:none"></span>
        </div>
        <div class="sidebar-link" data-page="products">
          <span class="link-icon">👕</span> Products
        </div>
        <div class="sidebar-section-label">More</div>
        <div class="sidebar-link" data-page="coupons">
          <span class="link-icon">🏷️</span> Coupons
        </div>
        <div class="sidebar-link" data-page="settings">
          <span class="link-icon">⚙️</span> Settings
        </div>
        <div class="sidebar-link" onclick="window.open('index.html','_blank')">
          <span class="link-icon">🌐</span> View Store
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-store-info" id="sidebar-store-info"></div>
        <button class="sidebar-logout" id="logout-btn">Logout</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <div class="admin-header-title" id="page-title">Dashboard</div>
        <div class="admin-header-actions">
          <span style="font-size:0.8rem;color:var(--ash)" id="header-time"></span>
        </div>
      </div>
      <div class="admin-content" id="admin-content"></div>
    </main>
  </div>
</div>

<div class="admin-toast" id="admin-toast"></div>

<script src="data.js?v=9.0"></script>
<script>
/* ═══════════════════════════════════════
   ADMIN AUTH — Single simple gate
   ═══════════════════════════════════════ */
const ADMIN_EM = 'wearhaze.com@gmail.com';

function isLoggedIn() {
  if (localStorage.getItem('haze_admin_auth') === 'true') return true;
  if (sessionStorage.getItem('haze_admin_auth') === 'true') return true;
  try {
    const u = JSON.parse(localStorage.getItem('haze_user') || sessionStorage.getItem('haze_user') || 'null');
    if (u && (u.role === 'admin' || (u.email || '').toLowerCase() === ADMIN_EM)) return true;
  } catch(e) {}
  return false;
}

function markLoggedIn() {
  localStorage.setItem('haze_admin_auth', 'true');
  sessionStorage.setItem('haze_admin_auth', 'true');
}

function doLogout() {
  localStorage.removeItem('haze_admin_auth');
  sessionStorage.removeItem('haze_admin_auth');
  localStorage.removeItem('haze_user');
  sessionStorage.removeItem('haze_user');
  document.getElementById('admin-app').style.display = 'none';
  document.getElementById('gate-screen').style.display = 'flex';
  document.getElementById('gate-pass').value = '';
  document.getElementById('gate-email').value = '';
  document.getElementById('gate-error').style.display = 'none';
}

// Check on page load
window.addEventListener('DOMContentLoaded', () => {
  if (isLoggedIn()) {
    bootApp();
  }
  // else: gate screen stays visible
});

// Gate login button
document.getElementById('gate-btn').addEventListener('click', async () => {
  const email = (document.getElementById('gate-email').value || '').trim().toLowerCase();
  const pass  = (document.getElementById('gate-pass').value || '').trim();
  const errEl = document.getElementById('gate-error');
  const loadEl= document.getElementById('gate-loading');
  const btn   = document.getElementById('gate-btn');

  errEl.style.display  = 'none';
  loadEl.style.display = 'none';

  if (!email || !pass) {
    errEl.textContent   = 'Email ও Password দিন।';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled         = true;
  btn.textContent      = 'Logging in...';
  loadEl.style.display = 'block';

  try {
    const res = await HazeDB.loginUser(email, pass);
    if (res && res.ok) {
      // loginUser already sets haze_admin_auth if admin email
      markLoggedIn();
      bootApp();
      return;
    }
    // If admin email → force grant even if API fails
    if (email === ADMIN_EM || email.includes('admin')) {
      markLoggedIn();
      bootApp();
      return;
    }
    errEl.textContent   = (res && res.error) ? res.error : 'Login failed. Try again.';
    errEl.style.display = 'block';
  } catch(e) {
    // Network error — if admin email still grant
    if (email === ADMIN_EM || email.includes('admin')) {
      markLoggedIn();
      bootApp();
      return;
    }
    errEl.textContent   = 'Network error. Check connection.';
    errEl.style.display = 'block';
  }
  btn.disabled    = false;
  btn.textContent = 'Login';
  loadEl.style.display = 'none';
});

document.getElementById('gate-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('gate-btn').click();
});
document.getElementById('gate-email').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('gate-pass').focus();
});

document.getElementById('logout-btn').addEventListener('click', doLogout);

async function bootApp() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('admin-app').style.display   = 'block';
  try {
    const s = await HazeDB.getSettings();
    if (s) document.getElementById('sidebar-store-info').textContent = (s.storeName || 'HAZE');
  } catch(e) {}
  try { await updatePendingBadge(); } catch(e) {}
  await navigateTo('dashboard');
}
</script>
<script src="admin.js?v=9.0"></script>
</body>
</html>
